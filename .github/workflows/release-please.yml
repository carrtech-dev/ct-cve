name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    # Runs on a GitHub-hosted runner: release-please makes many GitHub API
    # calls while walking release history, and ct-ops keeps this class of job
    # hosted to avoid self-hosted runner network instability affecting release
    # PR creation.
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish-image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Reset workspace ownership
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine \
            chown -R $(id -u):$(id -g) /ws 2>/dev/null || true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Clean up runner workspace
        if: always()
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine \
            chown -R "$(id -u):$(id -g)" /ws 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
          docker buildx prune -f --filter "until=1h" 2>/dev/null || true
          docker system prune -f --filter "until=1h" 2>/dev/null || true
          exit 0

  customer-bundle:
    needs:
      - release
      - publish-image
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package customer install bundle
        run: |
          set -euo pipefail
          TAG_NAME="${{ needs.release.outputs.tag_name }}"
          VERSION="${TAG_NAME#ct-cve-}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish-image.outputs.image_digest }}"
          bash deploy/scripts/package-customer-bundle.sh dist "$VERSION" "$IMAGE_REF"

      - name: Upload customer install bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/ct-cve-single-*.zip \
            dist/ct-cve-single-*.zip.sha256 \
            dist/ct-cve-single.zip \
            dist/ct-cve-single.zip.sha256 \
            --clobber
